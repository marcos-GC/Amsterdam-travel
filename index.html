<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ámsterdam en bici</title>
<meta name="theme-color" content="#B83A2C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ámsterdam">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app" hidden>
  <header class="top">
    <h1>Ámsterdam en bici</h1>
    <span class="clock" id="clock"></span>
    <button class="iconbtn" id="hdrMic" type="button" aria-label="Hablar con Claude">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
    </button>
  </header>
  <div class="offline" id="offline" hidden>Sin conexión: ves la última copia guardada.</div>
  <main>
    <section class="view" id="view-ruta" aria-label="Ruta"><div class="pad">
      <div class="days" id="dayTabs" role="group" aria-label="Día"></div>
      <div id="day"></div>
    </div></section>

    <section class="view" id="view-mapa" aria-label="Mapa" hidden>
      <div id="map"></div>
      <div class="mapbar" id="mapbar" role="group" aria-label="Filtrar por día"></div>
      <div class="mapside">
        <button class="fab small" id="locBtn" type="button" aria-label="Mi ubicación"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
        <button class="fab" id="addPlaceBtn" type="button" aria-label="Añadir sitio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
      <div class="legend" id="legend"></div>
      <div class="card" id="card" hidden></div>
      <div class="toast" id="mapHint" hidden></div>
    </section>

    <section class="view chatview" id="view-claude" aria-label="Claude" hidden>
      <div class="chatlog" id="chatlog"></div>
      <div class="composer">
        <div class="attached" id="attached" hidden></div>
        <div class="row">
          <button class="iconbtn round" id="attachBtn" type="button" aria-label="Adjuntar documento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11l-8.5 8.5a5 5 0 01-7-7L14 4a3.5 3.5 0 015 5l-8.5 8.5a2 2 0 01-3-3L15 7"/></svg></button>
          <label class="sr" for="msg">Mensaje para Claude</label>
          <textarea id="msg" rows="1" placeholder="Pregunta o pide algo…"></textarea>
          <button class="iconbtn round mic" id="micBtn" type="button" aria-label="Dictar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>
          <button class="iconbtn round send" id="sendBtn" type="button" aria-label="Enviar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </div>
        <label class="autosend"><input type="checkbox" id="autoSend"> Enviar al terminar de dictar</label>
      </div>
    </section>

    <section class="view" id="view-docs" aria-label="Documentos" hidden><div class="pad">
      <div class="sectionhead"><h2>Documentos</h2>
        <label class="btn primary" for="fileIn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>Subir</label>
        <input type="file" id="fileIn" accept="application/pdf,image/*,text/plain" multiple hidden>
      </div>
      <p class="small">Billetes, reservas, fotos de carteles o menús. Los veis los dos y Claude puede leerlos.</p>
      <div id="docs"></div>
    </div></section>

    <section class="view" id="view-viaje" aria-label="Viaje" hidden><div class="pad" id="viaje"></div></section>
  </main>
  <nav class="tabs" id="tabs" aria-label="Secciones">
    <a href="#ruta" data-tab="ruta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="3"/><circle cx="18" cy="18" r="3"/><path d="M6 18l4-8h5l3 8M10 10L8.5 6H6M15 10l-1.5-4H16"/></svg>Ruta</a>
    <a href="#mapa" data-tab="mapa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>Mapa</a>
    <a href="#claude" data-tab="claude"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4V5z"/><path d="M8 10h8M8 13h5"/></svg>Claude</a>
    <a href="#docs" data-tab="docs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg>Docs</a>
    <a href="#viaje" data-tab="viaje"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M8 6V4h8v2M3 11h18"/></svg>Viaje</a>
  </nav>
</div>

<div class="login" id="login" hidden>
  <form id="loginForm" class="loginbox" autocomplete="off">
    <img src="icon.svg" alt="" width="72" height="72">
    <h1>Ámsterdam en bici</h1>
    <p>7–9 de noviembre de 2026</p>
    <label for="codeIn">Código del viaje</label>
    <input id="codeIn" type="password" inputmode="text" autocomplete="current-password" required>
    <fieldset>
      <legend>¿Quién eres?</legend>
      <label class="chipradio"><input type="radio" name="who" value="Marcos" checked><span>Marcos</span></label>
      <label class="chipradio"><input type="radio" name="who" value="Isabel"><span>Isabel</span></label>
    </fieldset>
    <button class="btn primary big" type="submit">Entrar</button>
    <p class="err" id="loginErr" role="alert"></p>
  </form>
</div>

<div class="sheet-backdrop" id="sheetBg" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>
</body>
</html>
